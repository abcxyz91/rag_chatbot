[project]
name = "rag_chatbot"
version = "0.1.0"
description = "rag_chatbot using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]~=0.157.0",
    "streamlit>=1.32.0",
    "chromadb==0.5.23",
    "embedchain==0.1.128",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.4.0,<1.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0"
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
kickoff = "rag_chatbot.main:kickoff"
run_crew = "rag_chatbot.main:kickoff"
plot = "rag_chatbot.main:plot"
rag-chatbot = "rag_chatbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
